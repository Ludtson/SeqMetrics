<svg width="1100" height="760" viewBox="0 0 1100 760" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .body { font-family: Arial, Helvetica, sans-serif; }
      .mono { font-family: Consolas, 'Courier New', monospace; }
      .display { font-family: Georgia, 'Times New Roman', serif; font-weight: 700; }
    </style>
  </defs>

  <rect x="0" y="0" width="1100" height="760" fill="#f7f5f0"/>

  <!-- Header -->
  <text x="40" y="38" class="mono" font-size="12" letter-spacing="2" fill="#2f6f5e">SEQMETRICS &#183; ARCHITECTURE</text>
  <text x="40" y="70" class="display" font-size="28" fill="#1f2a24">One orchestrator, eight independent modules</text>
  <text x="40" y="96" class="body" font-size="13.5" fill="#5b6a60">Every module reads a plain CDS or protein FASTA and writes one TSV. run_features.py checks only the</text>
  <text x="40" y="114" class="body" font-size="13.5" fill="#5b6a60">dependencies a requested module needs, and resolves each one through whichever of a direct PATH binary,</text>
  <text x="40" y="132" class="body" font-size="13.5" fill="#5b6a60">native conda, WSL-bridged conda, or an isolated venv it was actually set up in -- nobody installs the whole panel.</text>

  <!-- Input pills -->
  <g>
    <rect x="40" y="152" width="150" height="34" rx="17" fill="#e6edf6" stroke="#3d6fa8" stroke-width="1.4"/>
    <circle cx="60" cy="169" r="8" fill="none" stroke="#3d6fa8" stroke-width="1.4"/>
    <text x="60" y="173" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#3d6fa8">nt</text>
    <text x="78" y="173" class="mono" font-size="12" fill="#3d6fa8">CDS FASTA &#183; .fna</text>
  </g>
  <g>
    <rect x="204" y="152" width="164" height="34" rx="17" fill="#f7e9e0" stroke="#b0562e" stroke-width="1.4"/>
    <circle cx="224" cy="169" r="8" fill="none" stroke="#b0562e" stroke-width="1.4"/>
    <text x="224" y="173" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#b0562e">aa</text>
    <text x="242" y="173" class="mono" font-size="12" fill="#b0562e">Protein FASTA &#183; .faa</text>
  </g>

  <!-- spine -->
  <line x1="130" y1="186" x2="130" y2="210" stroke="#dcd6c8" stroke-width="2"/>

  <!-- Hub -->
  <rect x="60" y="210" width="360" height="64" rx="12" fill="#ffffff" stroke="#2f6f5e" stroke-width="1.8"/>
  <g transform="translate(78,224)">
    <rect x="0" y="0" width="34" height="34" rx="8" fill="#e4efe9" stroke="#2f6f5e" stroke-width="1.4"/>
    <circle cx="17" cy="17" r="3.2" fill="#2f6f5e"/>
    <line x1="17" y1="7" x2="17" y2="12.5" stroke="#2f6f5e" stroke-width="1.4"/>
    <line x1="17" y1="21.5" x2="17" y2="27" stroke="#2f6f5e" stroke-width="1.4"/>
    <line x1="7" y1="17" x2="12.5" y2="17" stroke="#2f6f5e" stroke-width="1.4"/>
    <line x1="21.5" y1="17" x2="27" y2="17" stroke="#2f6f5e" stroke-width="1.4"/>
  </g>
  <text x="126" y="238" class="display" font-size="16" fill="#1f2a24">run_features.py</text>
  <text x="126" y="256" class="mono" font-size="10.5" fill="#5b6a60">direct / conda / wsl_conda / venv &#183; --modules --batch --jobs</text>

  <!-- fan-out -->
  <line x1="130" y1="274" x2="130" y2="296" stroke="#dcd6c8" stroke-width="2"/>
  <line x1="130" y1="296" x2="1030" y2="296" stroke="#dcd6c8" stroke-width="2"/>

  <!-- Module card template values -->
  <!-- Row 1 -->
  <g transform="translate(40,320)">
    <!-- basic -->
    <line x1="90" y1="-24" x2="90" y2="0" stroke="#dcd6c8" stroke-width="2"/>
    <rect x="0" y="0" width="245" height="118" rx="10" fill="#ffffff" stroke="#dcd6c8" stroke-width="1.2"/>
    <text x="14" y="24" class="display" font-size="15" fill="#1f2a24">basic</text>
    <rect x="200" y="12" width="32" height="18" rx="5" fill="#e6edf6"/>
    <text x="216" y="25" text-anchor="middle" class="mono" font-size="10" fill="#3d6fa8">nt</text>
    <text x="14" y="46" class="body" font-size="11.5" fill="#5b6a60">pure Python</text>
    <text x="14" y="61" class="body" font-size="11.5" fill="#5b6a60">length, GC%</text>
    <line x1="14" y1="86" x2="231" y2="86" stroke="#dcd6c8" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="14" y="103" class="mono" font-size="10" fill="#5b6a60">no external tool</text>
  </g>

  <g transform="translate(305,320)">
    <!-- tail_hydrophobicity -->
    <line x1="122" y1="-24" x2="122" y2="0" stroke="#dcd6c8" stroke-width="2"/>
    <rect x="0" y="0" width="245" height="118" rx="10" fill="#ffffff" stroke="#dcd6c8" stroke-width="1.2"/>
    <text x="14" y="24" class="display" font-size="15" fill="#1f2a24">tail_hydrophobicity</text>
    <rect x="200" y="12" width="32" height="18" rx="5" fill="#f7e9e0"/>
    <text x="216" y="25" text-anchor="middle" class="mono" font-size="10" fill="#b0562e">aa</text>
    <text x="14" y="46" class="body" font-size="11.5" fill="#5b6a60">CTTH</text>
    <text x="14" y="61" class="body" font-size="11.5" fill="#5b6a60">C-terminal tail descriptors</text>
    <line x1="14" y1="86" x2="231" y2="86" stroke="#dcd6c8" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="14" y="103" class="mono" font-size="10" fill="#5b6a60">no external tool</text>
  </g>

  <g transform="translate(570,320)">
    <!-- composition -->
    <line x1="122" y1="-24" x2="122" y2="0" stroke="#dcd6c8" stroke-width="2"/>
    <rect x="0" y="0" width="245" height="118" rx="10" fill="#ffffff" stroke="#dcd6c8" stroke-width="1.2"/>
    <text x="14" y="24" class="display" font-size="15" fill="#1f2a24">composition</text>
    <rect x="200" y="12" width="32" height="18" rx="5" fill="#f7e9e0"/>
    <text x="216" y="25" text-anchor="middle" class="mono" font-size="10" fill="#b0562e">aa</text>
    <text x="14" y="46" class="body" font-size="11.5" fill="#5b6a60">EMBOSS PEPSTATS</text>
    <line x1="14" y1="86" x2="231" y2="86" stroke="#dcd6c8" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="14" y="103" class="mono" font-size="10" fill="#5b6a60">conda &#183; em_boss</text>
  </g>

  <g transform="translate(835,320)">
    <!-- aggregation -->
    <line x1="122" y1="-24" x2="122" y2="0" stroke="#dcd6c8" stroke-width="2"/>
    <rect x="0" y="0" width="230" height="118" rx="10" fill="#ffffff" stroke="#dcd6c8" stroke-width="1.2"/>
    <text x="14" y="24" class="display" font-size="15" fill="#1f2a24">aggregation</text>
    <rect x="184" y="12" width="32" height="18" rx="5" fill="#f7e9e0"/>
    <text x="200" y="25" text-anchor="middle" class="mono" font-size="10" fill="#b0562e">aa</text>
    <text x="14" y="46" class="body" font-size="11.5" fill="#5b6a60">HCA + TANGO</text>
    <line x1="14" y1="86" x2="216" y2="86" stroke="#dcd6c8" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="14" y="103" class="mono" font-size="10" fill="#5b6a60">conda &#183; hca_tango</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(40,460)">
    <!-- disorder (gated) -->
    <line x1="122" y1="-24" x2="122" y2="0" stroke="#dcd6c8" stroke-width="2"/>
    <rect x="0" y="0" width="245" height="128" rx="10" fill="#ffffff" stroke="#dcd6c8" stroke-width="1.2"/>
    <text x="14" y="24" class="display" font-size="15" fill="#1f2a24">disorder</text>
    <rect x="200" y="12" width="32" height="18" rx="5" fill="#f7e9e0"/>
    <text x="216" y="25" text-anchor="middle" class="mono" font-size="10" fill="#b0562e">aa</text>
    <text x="14" y="46" class="body" font-size="11.5" fill="#5b6a60">IUPred3 + ANCHOR2</text>
    <text x="14" y="61" class="body" font-size="11.5" fill="#5b6a60">cysteine-excluded</text>
    <line x1="14" y1="86" x2="231" y2="86" stroke="#dcd6c8" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="18" cy="99" r="3.5" fill="#a8710a"/>
    <text x="28" y="103" class="mono" font-size="10" fill="#a8710a">conda &#183; iupred3</text>
    <text x="14" y="118" class="mono" font-size="9.5" fill="#a8710a">license-gated, never bundled</text>
  </g>

  <g transform="translate(305,460)">
    <!-- codon_usage -->
    <line x1="122" y1="-24" x2="122" y2="0" stroke="#dcd6c8" stroke-width="2"/>
    <rect x="0" y="0" width="245" height="128" rx="10" fill="#ffffff" stroke="#dcd6c8" stroke-width="1.2"/>
    <text x="14" y="24" class="display" font-size="15" fill="#1f2a24">codon_usage</text>
    <rect x="200" y="12" width="32" height="18" rx="5" fill="#e6edf6"/>
    <text x="216" y="25" text-anchor="middle" class="mono" font-size="10" fill="#3d6fa8">nt</text>
    <text x="14" y="46" class="body" font-size="11.5" fill="#5b6a60">codonW &#183; scores against a</text>
    <text x="14" y="61" class="body" font-size="11.5" fill="#5b6a60">pre-built per-species reference</text>
    <line x1="14" y1="86" x2="231" y2="86" stroke="#dcd6c8" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="14" y="103" class="mono" font-size="10" fill="#5b6a60">conda &#183; codon_w</text>
    <text x="14" y="118" class="mono" font-size="9.5" fill="#5b6a60">needs --module-ref</text>
  </g>

  <g transform="translate(570,460)">
    <!-- coding_potential -->
    <line x1="122" y1="-24" x2="122" y2="0" stroke="#dcd6c8" stroke-width="2"/>
    <rect x="0" y="0" width="245" height="128" rx="10" fill="#ffffff" stroke="#dcd6c8" stroke-width="1.2"/>
    <text x="14" y="24" class="display" font-size="15" fill="#1f2a24">coding_potential</text>
    <rect x="200" y="12" width="32" height="18" rx="5" fill="#e6edf6"/>
    <text x="216" y="25" text-anchor="middle" class="mono" font-size="10" fill="#3d6fa8">nt</text>
    <text x="14" y="46" class="body" font-size="11.5" fill="#5b6a60">CPAT &#183; scores against a</text>
    <text x="14" y="61" class="body" font-size="11.5" fill="#5b6a60">pre-built hexamer/logit model</text>
    <line x1="14" y1="86" x2="231" y2="86" stroke="#dcd6c8" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="14" y="103" class="mono" font-size="10" fill="#5b6a60">conda &#183; cpat</text>
    <text x="14" y="118" class="mono" font-size="9.5" fill="#5b6a60">needs --module-ref</text>
  </g>

  <g transform="translate(835,460)">
    <!-- tm_domain -->
    <line x1="115" y1="-24" x2="115" y2="0" stroke="#dcd6c8" stroke-width="2"/>
    <rect x="0" y="0" width="230" height="128" rx="10" fill="#ffffff" stroke="#dcd6c8" stroke-width="1.2"/>
    <text x="14" y="24" class="display" font-size="15" fill="#1f2a24">tm_domain</text>
    <rect x="184" y="12" width="32" height="18" rx="5" fill="#f7e9e0"/>
    <text x="200" y="25" text-anchor="middle" class="mono" font-size="10" fill="#b0562e">aa</text>
    <text x="14" y="46" class="body" font-size="11.5" fill="#5b6a60">DeepTMHMM2 &#183; CPU,</text>
    <text x="14" y="61" class="body" font-size="11.5" fill="#5b6a60">ungated reimplementation</text>
    <line x1="14" y1="86" x2="216" y2="86" stroke="#dcd6c8" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="14" y="103" class="mono" font-size="10" fill="#5b6a60">isolated venv</text>
    <text x="14" y="118" class="mono" font-size="9.5" fill="#5b6a60">not conda</text>
  </g>

  <!-- Row 3: localization, centered -->
  <g transform="translate(430,608)">
    <line x1="122" y1="-24" x2="122" y2="0" stroke="#dcd6c8" stroke-width="2"/>
    <rect x="0" y="0" width="245" height="118" rx="10" fill="#ffffff" stroke="#dcd6c8" stroke-width="1.2"/>
    <text x="14" y="24" class="display" font-size="15" fill="#1f2a24">localization</text>
    <rect x="200" y="12" width="32" height="18" rx="5" fill="#f7e9e0"/>
    <text x="216" y="25" text-anchor="middle" class="mono" font-size="10" fill="#b0562e">aa</text>
    <text x="14" y="46" class="body" font-size="11.5" fill="#5b6a60">LOCALIZER &#183; plant-specific</text>
    <line x1="14" y1="66" x2="231" y2="66" stroke="#dcd6c8" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="18" cy="79" r="3.5" fill="#a8710a"/>
    <text x="28" y="83" class="mono" font-size="10" fill="#a8710a">conda em_boss + Java + Perl</text>
    <text x="14" y="98" class="mono" font-size="9.5" fill="#a8710a">license-gated, never bundled</text>
    <text x="14" y="112" class="mono" font-size="9.5" fill="#5b6a60">needs --module-ref</text>
  </g>

  <!-- Legend -->
  <g transform="translate(40,745)">
    <circle cx="6" cy="-4" r="5" fill="#3d6fa8"/>
    <text x="16" y="0" class="body" font-size="11.5" fill="#5b6a60">nucleotide (.fna) input</text>
    <circle cx="190" cy="-4" r="5" fill="#b0562e"/>
    <text x="200" y="0" class="body" font-size="11.5" fill="#5b6a60">protein (.faa) input</text>
    <circle cx="370" cy="-4" r="5" fill="#a8710a"/>
    <text x="380" y="0" class="body" font-size="11.5" fill="#5b6a60">third-party tool needs its own license/registration -- never bundled</text>
  </g>
</svg>
